# 개발용 실행: docker compose up --build  →  http://localhost:8000
# 비밀번호는 개발용 값이다. 이 파일 그대로 인터넷에 공개되는 서버에 쓰지 않는다.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: murder_mystery
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d murder_mystery"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: devpassword
      PGDATABASE: murder_mystery
      MM_DATABASE_URL: "dbname=murder_mystery"
      # AI 플레이어(backend/scripts/ai_players.py)가 쓴다. 프로젝트 폴더의 .env 파일에 ANTHROPIC_API_KEY=... 를 적어 둔다(.env 는 저장소에 올라가지 않는다).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MM_AI_MODEL: ${MM_AI_MODEL:-claude-haiku-5-5}
      # 대기실의 "AI 추가" 버튼(방장이 누를 때마다 AI 가 한 명씩 입장한다). 위 ANTHROPIC_API_KEY 가 있으면 모델을 쓰는 AI 도, 없으면 규칙으로 움직이는 간단한 AI 만 부를 수 있다.
      # 비용이 서버의 키로 나가므로 **내 컴퓨터에서만 여는 시연용**(아래 포트는 127.0.0.1 에만 열린다)으로 기본을 켜 두었다. 인터넷에 공개하는 서버에서는 false 로 끈다.
      MM_AI_ENABLED: ${MM_AI_ENABLED:-true}
      MM_AI_EFFORT: ${MM_AI_EFFORT:-low}
      # 시연용 샘플 작품 「동짓날 마을회관」의 제작 계정(sample_maker)의 패스워드. 제작 과정을 보여 줄 때 이 계정으로 로그인한다. 로컬 시연 전용이며, 인터넷에 공개하는 서버에서는 바꾸거나 비운다(비우면 아무도 로그인할 수 없다).
      # 업로드한 이미지·영상을 저장하는 폴더(아래 media 볼륨). 파일 이름이 내용 해시라서 같은 파일은 한 번만 저장된다.
      MM_MEDIA_DIR: /app/media
      # 시연용 미디어 폴더(프로젝트의 demo_media/). 샘플 작품을 처음 만들 때 파일 이름 규칙대로 붙는다(demo_media/README.md).
      MM_DEMO_MEDIA_DIR: /app/demo_media
      MM_SAMPLE_MAKER_PASSWORD: ${MM_SAMPLE_MAKER_PASSWORD:-sample1234}
      # (임시) 여러 계정을 만들어 시험하려고 패스워드 최소 글자 수를 1 로 낮췄다. 시험이 끝나면 이 줄을 지우면 기본값 8 로 돌아간다.
    ports:
      # 내 컴퓨터에서만 열린다. 같은 네트워크의 다른 기기에는 열지 않는다. 8000 이 쓰이고 있으면 앞 숫자를 바꾼다.
      - "127.0.0.1:8000:8000"
    volumes:
      # 업로드한 파일은 컨테이너를 다시 만들어도 남는다(`docker compose down -v` 를 하면 지워진다).
      - media:/app/media
      # 시연용 이미지·영상은 프로젝트 폴더에서 읽기만 한다(이미지에 넣지 않으므로 파일을 바꿔도 다시 빌드할 필요가 없다).
      - ./demo_media:/app/demo_media:ro

volumes:
  pgdata:
  media:
