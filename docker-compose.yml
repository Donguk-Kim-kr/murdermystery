# 개발용 실행: docker compose up --build  →  http://localhost:8000
# 비밀번호는 개발용 값이다. 이 파일 그대로 인터넷에 공개되는 서버에 쓰지 않는다.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: murder_mystery
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d murder_mystery"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: devpassword
      PGDATABASE: murder_mystery
      MM_DATABASE_URL: "dbname=murder_mystery"
    ports:
      # 내 컴퓨터에서만 열린다. 같은 네트워크의 다른 기기에는 열지 않는다. 8000 이 쓰이고 있으면 앞 숫자를 바꾼다.
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
