# push 와 풀 리퀘스트마다 서버·DB·화면 시험을 자동으로 돌린다(API 키는 필요 없다. AI 관련 시험은 가짜 프로세스를 쓴다).
# 브라우저 e2e 시험(e2e/)은 서버와 Chromium 설정이 더 필요해서 넣지 않았다.
name: 시험

on:
  push:
  pull_request:

# 같은 브랜치에 연달아 push 하면 앞선 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 서버 시험
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: 마이그레이션 실행기가 쓰는 psql 확인
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  db:
    name: DB 시험
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 마이그레이션 실행기가 쓰는 psql 확인
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      # 명세서(xlsx)를 읽는 시험이 openpyxl 을 쓴다.
      - run: pip install pytest "psycopg[binary]" openpyxl
      - run: python -m pytest -q db/tests

  frontend:
    name: 화면 시험
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
